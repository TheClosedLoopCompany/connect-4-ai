<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Play Connect 4 against GPT-6, Jev, or a perfect solver.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#2456c9">
<meta property="og:title" content="Can you beat AI in Connect Four?">
<meta property="og:description" content="Play GPT-6, Jev, or a perfect solver.">

<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
  /* dvh = the visible viewport on phones, so nothing scrolls when it fits; no rubber-band bounce. */
  html, body { overscroll-behavior: none; overflow-x: hidden; }
  body { display: grid; place-items: center; margin: 0; min-height: 100vh; min-height: 100dvh; }
  main { display: grid; gap: 14px; justify-items: center; padding: 16px 12px; width: 100%; max-width: 504px; }
  h1 { margin: 0; font-size: 1.4rem; }
  .settings { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; }
  label { display: flex; gap: 6px; align-items: center; font-size: .9rem; }
  label.off { opacity: .5; }
  select, button { font: inherit; padding: 4px 8px; touch-action: manipulation; }
  /* Chips sit under the blue frame: each cell's ::after is the frame with a hole cut out. */
  #board { display: grid; grid-template-columns: repeat(7, 1fr); position: relative; isolation: isolate;
           overflow: hidden; background: Canvas; border: 10px solid #2456c9; border-radius: 12px; width: 100%; }
  .cell { aspect-ratio: 1; background: none; border: none; padding: 0; cursor: pointer; position: relative; }
  .cell::after { content: ""; position: absolute; inset: -0.5px; z-index: 2; pointer-events: none;
                 background: radial-gradient(circle closest-side, transparent 83%, #2456c9 85%); }
  .chip { position: absolute; inset: 8%; border-radius: 50%; z-index: 1; }
  .chip.X { background: #e53935; }
  .chip.O { background: #fdd835; }
  .chip.win { box-shadow: inset 0 0 0 4px #fff; }
  .chip.drop { animation: drop var(--t) cubic-bezier(.55, 0, 1, .45); }
  .chip.last { animation: blink .3s ease-in-out 4 alternate; }
  @keyframes drop {
    from { transform: translateY(calc((var(--r) + 1) * -119%)); }
    85% { transform: translateY(0); }
    92% { transform: translateY(-6%); }
    to { transform: translateY(0); }
  }
  @keyframes blink { to { opacity: .35; } }
  #board.shake { animation: shake .6s cubic-bezier(.36, .07, .19, .97); }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(5px); }
    30%, 50%, 70% { transform: translateX(-10px); }
    40%, 60% { transform: translateX(10px); }
  }
  body { transition: background-color 1s, filter 1s; }
  body.gloom { filter: grayscale(.7) brightness(.8); }
  #board.locked .cell { cursor: default; }
  #status { min-height: 1.4em; font-weight: 600; text-align: center; }
  #repo { position: fixed; top: 14px; right: 16px; display: flex;
          color: inherit; opacity: .7; text-decoration: none; font-size: .9rem; }
  #repo:hover { opacity: 1; }
  #repo svg { width: 26px; height: 26px; fill: currentColor; }
  #celebration { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
  #info { display: inline-grid; place-items: center; width: 1.2em; height: 1.2em; border: 1.5px solid currentColor;
          border-radius: 50%; color: inherit; opacity: .6; text-decoration: none; font: italic 600 .8rem Georgia, serif; }
  #info:hover { opacity: 1; }
  #error { color: #e53935; font-size: .85rem; max-width: 460px; text-align: center; }
</style>
</head>
<body>
<a id="repo" href="https://github.com/TheClosedLoopCompany/connect-4-ai" target="_blank" rel="noopener" aria-label="Source code on GitHub">
  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
</a>
<main>
  <h1>Can you beat AI in Connect Four?</h1>
  <div class="settings">
    <label>Opponent
      <select id="engine">
        <option value="luna">GPT-6 Luna</option>
        <option value="sol">GPT-6 Sol</option>
        <option value="astra">GPT-6 Astra</option>
        <option value="jev">Jev</option>
        <option value="solver">Solver</option>
      </select>
      <a id="info" target="_blank" rel="noopener">i</a>
    </label>
    <label id="effortWrap">Thinking
      <select id="effort">
        <option value="" hidden>n/a</option><option>none</option><option>low</option><option selected>medium</option><option>high</option>
      </select>
    </label>
    <label>First move
      <select id="first"><option value="X">You</option><option value="O">AI</option></select>
    </label>
    <label>Music
      <select id="music">
        <option value="">Off</option><option value="calm">Calm</option><option value="energetic">Energetic</option>
        <option value="happy">Happy</option><option value="futuristic">Futuristic</option>
      </select>
    </label>
    <button id="reset">New game</button>
  </div>
  <div id="status"></div>
  <div id="board"></div>
  <div id="error"></div>
  <div id="turnstile"></div>
</main>
<canvas id="celebration"></canvas>
<script>
const ROWS = 6, COLS = 7;
const $ = (id) => document.getElementById(id);
let board, over, busy;
const NAMES = { luna: "GPT-6 Luna", sol: "GPT-6 Sol", astra: "GPT-6 Astra", jev: "Jev", solver: "Solver" };
const INFO = {
  luna: "https://platform.openai.com/docs/models/gpt-6-luna",
  sol: "https://platform.openai.com/docs/models/gpt-6-sol",
  astra: "https://platform.openai.com/docs/models/gpt-6-astra",
  jev: "https://docs.typesafe.ai",
  solver: "http://blog.gamesolver.org",
};

const settings = JSON.parse(localStorage.getItem("c4") || "{}");
if (settings.engine === "negamax") settings.engine = "solver";
settings.effort = { minimal: "none", xhigh: "high", max: "high" }[settings.effort] ?? settings.effort; // older versions
for (const k of ["engine", "effort", "first", "music"]) {
  if (settings[k]) $(k).value = settings[k];
  if ($(k).selectedIndex < 0) $(k).selectedIndex = 0; // e.g. saved "gpt"/"minimal" from an older version
  $(k).onchange = () => { settings[k] = $(k).value; localStorage.setItem("c4", JSON.stringify(settings)); syncEffort(); };
}
// Astra is pinned to "low" server-side; show that, locked, without touching the saved choice.
// The field always stays in place (greyed out when it doesn't apply) so the layout doesn't jump.
function syncEffort() {
  const engine = $("engine").value;
  $("info").href = INFO[engine];
  $("info").setAttribute("aria-label", `About ${NAMES[engine]}`);
  $("info").title = `About ${NAMES[engine]}`;
  const fixed = { astra: "low", jev: "", solver: "" }[engine];
  $("effort").disabled = fixed !== undefined;
  $("effortWrap").classList.toggle("off", fixed !== undefined);
  $("effort").value = fixed ?? (["none", "low", "medium", "high"].includes(settings.effort) ? settings.effort : "medium");
}
syncEffort();

function drop(col, p) {
  for (let r = ROWS - 1; r >= 0; r--) if (board[r][col] === ".") { board[r][col] = p; return r; }
  return -1;
}

function winLine(r, c) {
  const p = board[r][c];
  for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
    const line = [[r, c]];
    for (const s of [1, -1]) {
      let rr = r + dr * s, cc = c + dc * s;
      while (board[rr]?.[cc] === p) { line.push([rr, cc]); rr += dr * s; cc += dc * s; }
    }
    if (line.length >= 4) return line;
  }
}

let cells; // cells[r][c] -> button; built once per game so animations don't replay

function buildBoard() {
  $("board").innerHTML = "";
  cells = board.map(() => []);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const b = document.createElement("button");
    b.className = "cell";
    b.onclick = () => play(c);
    cells[r][c] = b;
    $("board").append(b);
  }
}

const lock = () => $("board").classList.toggle("locked", over || busy);

// Drops a chip with animation; resolves once it has landed.
async function place(col, p) {
  const r = drop(col, p);
  const chip = document.createElement("div");
  const t = 250 + r * 60;
  chip.className = `chip ${p} drop`;
  chip.style.setProperty("--r", r);
  chip.style.setProperty("--t", t + "ms");
  cells[r][col].append(chip);
  const wasBusy = busy;
  busy = true; lock();
  await new Promise((ok) => setTimeout(ok, t));
  busy = wasBusy;
  chip.classList.remove("drop");
  if (p === "O") {
    document.querySelector(".chip.last")?.classList.remove("last");
    chip.classList.add("last");
  }
  const win = winLine(r, col);
  if (win) {
    over = true;
    for (const [wr, wc] of win) cells[wr][wc].firstChild.classList.add("win");
    $("status").textContent = p === "X" ? "You win! 🎉" : `${NAMES[$("engine").value]} wins.`;
    p === "X" ? celebrate() : mourn();
  } else if (board[0].every((v) => v !== ".")) { over = true; $("status").textContent = "Draw."; }
  lock();
}

async function play(col) {
  if (over || busy || board[0][col] !== ".") return;
  await place(col, "X");
  if (!over) await aiTurn();
}

async function aiTurn() {
  busy = true; $("error").textContent = "";
  const name = NAMES[$("engine").value];
  $("status").textContent = `${name} is thinking…`;
  lock();
  const t = performance.now();
  try {
    const data = $("engine").value === "solver" ? await solverMove(board) : await apiMove();
    const secs = ((performance.now() - t) / 1000).toFixed(1);
    const conf = data.confidence != null ? `, ${(data.confidence * 100).toFixed(0)}% confident` : data.detail ? `, ${data.detail}` : "";
    $("status").textContent = `${name} played column ${data.column + 1} (${secs}s${conf}). Your turn.`;
    if (data.note) $("error").textContent = data.note;
    await place(data.column, "O");
    busy = false;
    lock();
  } catch (e) {
    busy = false;
    $("error").textContent = e.message;
    $("status").innerHTML = "";
    const retry = document.createElement("button");
    retry.textContent = "Retry AI move";
    retry.onclick = aiTurn;
    $("status").append(retry);
    lock();
  }
}

// The solver runs locally in a Web Worker; the transposition table persists between moves.
let solver;
function solverMove(board) {
  solver ??= new Worker("/solver.js");
  return new Promise((ok, fail) => {
    solver.onmessage = (e) => ok(e.data);
    solver.onerror = (e) => fail(new Error(e.message || "Solver failed"));
    solver.postMessage({ board });
  });
}

// Bot protection: when the server has Turnstile configured, solve it once to get
// a session cookie; redo it if the session expires.
let session = fetch("/api/config").then((r) => r.json()).then((c) => c.turnstileSiteKey ? turnstileSession(c.turnstileSiteKey, c.turnstileAction) : null);
let renewSession;
function turnstileSession(sitekey, action) {
  return new Promise((ok, fail) => {
    const script = document.createElement("script");
    script.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
    script.onerror = () => fail(new Error("Could not load the bot check"));
    script.onload = () => {
      let resolve = ok, reject = fail;
      const widget = turnstile.render("#turnstile", {
        sitekey,
        action,
        appearance: "interaction-only",
        callback: async (token) => {
          const res = await fetch("/api/session", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token }) });
          res.ok ? resolve() : reject(new Error("Bot check failed. Reload the page."));
        },
        "error-callback": () => reject(new Error("Bot check failed. Reload the page.")),
      });
      renewSession = () => new Promise((ok2, fail2) => { resolve = ok2; reject = fail2; turnstile.reset(widget); });
    };
    document.head.append(script);
  });
}

async function apiMove(retried = false) {
  await session;
  const res = await fetch("/api/move", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ board, engine: $("engine").value, effort: $("effort").value }),
  });
  const data = await res.json();
  if (res.status === 401 && !retried && renewSession) { session = renewSession(); return apiMove(true); }
  if (!res.ok) throw new Error(data.error);
  return data;
}

// Win/lose effects on a full-screen canvas; plain canvas, no library.
function animate(bits, step, draw, ms) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("celebration"), ctx = cv.getContext("2d"), dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const start = performance.now();
  let last = start;
  (function frame(now) {
    // Physics is time-based (k = frames at 120 fps), so 60 Hz phones aren't in slow motion.
    const k = Math.min((now - last) / (1000 / 120), 6);
    last = now;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.globalAlpha = Math.min(1, Math.max(0, (start + ms - now) / 1000)); // fade out over the last second
    for (const b of bits) { step(b, k); draw(ctx, b, dpr); }
    if (now < start + ms) requestAnimationFrame(frame); else ctx.clearRect(0, 0, cv.width, cv.height);
  })(start);
}

// Win: big confetti cannons from both bottom corners, sized to reach the top of the screen.
function celebrate() {
  const colors = ["#e53935", "#fdd835", "#2456c9", "#43a047", "#fb8c00", "#8e24aa", "#00acc1"];
  const reach = Math.sqrt(2 * 0.35 * innerHeight * 1.3);
  const count = Math.round(Math.min(400, Math.max(160, innerWidth * innerHeight / 2600))); // fewer on phones
  const bits = Array.from({ length: count }, (_, i) => {
    const left = i % 2 === 0, angle = (left ? -65 : -115) * Math.PI / 180 + (Math.random() - 0.5) * 0.9;
    const speed = reach * (0.6 + Math.random() * 0.6);
    return {
      x: left ? 0 : innerWidth, y: innerHeight, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      w: 12 + Math.random() * 12, h: 7 + Math.random() * 7, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
      flip: Math.random() * 6, color: colors[i % colors.length],
    };
  });
  animate(bits, (b, k) => {
    const drag = 0.985 ** k;
    b.vy += 0.35 * k; b.vx *= drag; b.vy *= drag; b.x += b.vx * k; b.y += b.vy * k; b.rot += b.vr * k; b.flip += 0.15 * k;
  }, (ctx, b, dpr) => {
    // rotate + paper-flutter squash + device scale in one transform (no save/restore)
    const cos = Math.cos(b.rot) * dpr, sin = Math.sin(b.rot) * dpr, sy = Math.cos(b.flip);
    ctx.setTransform(cos, sin, -sin * sy, cos * sy, b.x * dpr, b.y * dpr);
    ctx.fillStyle = b.color; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
  }, 4500);
}

// Lose: the board shakes and a gloomy rain of grey streaks pours down.
function mourn() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  $("board").classList.remove("shake"); void $("board").offsetWidth; $("board").classList.add("shake");
  document.body.classList.add("gloom");
  setTimeout(() => document.body.classList.remove("gloom"), 3500);
  const bits = Array.from({ length: 260 }, () => ({
    x: Math.random() * innerWidth * 1.2, y: -Math.random() * innerHeight, v: 9 + Math.random() * 8,
    len: 18 + Math.random() * 26, alpha: 0.25 + Math.random() * 0.45,
  }));
  animate(bits, (b, k) => {
    b.y += b.v * k; b.x -= b.v * 0.15 * k;
    if (b.y > innerHeight) { b.y = -b.len; b.x = Math.random() * innerWidth * 1.2; }
  }, (ctx, b, dpr) => {
    ctx.save(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha *= b.alpha; ctx.strokeStyle = "#90a4ae"; ctx.lineWidth = 2; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.len * 0.15, b.y + b.len); ctx.stroke(); ctx.restore();
  }, 3500);
}

// Background music: four loops synthesized live with Web Audio, no audio files. Off by default.
const hz = (m) => 440 * 2 ** ((m - 69) / 12); // MIDI note -> frequency
const rnd = (n) => (Math.imul(n + 1, 2654435761) >>> 0) / 2 ** 32; // repeatable "random" per step

// A small synth rack for one track. `S` is the length of a 16th note in seconds.
function instruments(ac, out, S) {
  const gain = (v) => { const g = ac.createGain(); g.gain.value = v; return g; };
  const filter = (type, freq, q = .7) => { const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q; return f; };
  const osc = (type, freq, t, end, dest) => {
    const o = ac.createOscillator(); o.type = type; o.frequency.value = freq; o.connect(dest); o.start(t); o.stop(end); return o;
  };
  const noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const noise = (t, end, dest) => {
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true; src.connect(dest); src.start(t, Math.random()); src.stop(end);
  };
  // Attack to `peak`, hold, then fade out; returns the time the voice is silent.
  const env = (g, t, attack, peak, hold, release) => {
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + attack);
    g.gain.setTargetAtTime(0, t + attack + hold, release / 4);
    return t + attack + hold + release;
  };

  // Reverb: a decaying burst of stereo noise as the impulse response. Echo: dotted-eighth delay.
  const rev = ac.createConvolver(), ir = ac.createBuffer(2, ac.sampleRate * 3, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 4; }
  rev.buffer = ir; rev.connect(out);
  const echo = ac.createDelay(2), damp = filter("lowpass", 2500);
  echo.delayTime.value = 3 * S;
  echo.connect(damp).connect(gain(.35)).connect(echo); damp.connect(out);
  const bus = (wet, echoes = 0) => {
    const g = gain(1); g.connect(out); g.connect(gain(wet)).connect(rev);
    if (echoes) g.connect(gain(echoes)).connect(echo);
    return g;
  };
  const ch = { pad: bus(.5), lead: bus(.3, .3), bass: bus(.05), drums: bus(.1), snare: bus(.35) };

  return {
    S,
    // Two detuned saws per note through a soft low-pass, swelling in and out.
    pad(t, notes, len, vol, cutoff) {
      const g = gain(0), f = filter("lowpass", cutoff); f.connect(g).connect(ch.pad);
      const end = env(g, t, len * .4, vol, len * .4, len * .5);
      for (const m of notes) for (const d of [-8, 8]) osc("sawtooth", hz(m), t, end, f).detune.value = d;
    },
    // Plucked synth: a bright attack whose filter closes quickly.
    pluck(t, m, { type = "square", vol = .05, decay = .25, cutoff = 1800 } = {}) {
      const g = gain(0), f = filter("lowpass", cutoff * 3, 2); f.connect(g).connect(ch.lead);
      f.frequency.setTargetAtTime(cutoff * .4, t, decay / 3);
      osc(type, hz(m), t, env(g, t, .004, vol, 0, decay), f);
    },
    // FM bell / mallet: a sine whose pitch is wobbled by a second sine at `ratio` times the note.
    bell(t, m, { vol = .06, decay = 1.2, ratio = 3.5, index = 2 } = {}) {
      const g = gain(0), mod = gain(0); g.connect(ch.lead);
      const end = env(g, t, .003, vol, 0, decay);
      mod.gain.setValueAtTime(hz(m) * index, t); mod.gain.setTargetAtTime(0, t, decay / 6);
      mod.connect(osc("sine", hz(m), t, end, g).frequency);
      osc("sine", hz(m) * ratio, t, end, mod);
    },
    bass(t, m, len, { type = "sawtooth", vol = .1, cutoff = 500 } = {}) {
      const g = gain(0), f = filter("lowpass", cutoff, 3); f.connect(g).connect(ch.bass);
      osc(type, hz(m), t, env(g, t, .005, vol, len, .08), f);
    },
    kick(t, vol = .5) {
      const g = gain(0); g.connect(ch.drums);
      osc("sine", 150, t, env(g, t, .002, vol, .02, .3), g).frequency.exponentialRampToValueAtTime(42, t + .12);
    },
    // Hats, snares, claps and crashes are filtered noise with different envelopes.
    hiss(t, { vol, decay, type = "highpass", freq = 7000, q = 1, to = ch.drums }) {
      const g = gain(0), f = filter(type, freq, q); f.connect(g).connect(to);
      noise(t, env(g, t, .002, vol, 0, decay), f);
    },
    hat(t, vol = .03, open = false) { this.hiss(t, { vol, decay: open ? .25 : .05 }); },
    snare(t, vol = .12) {
      this.hiss(t, { vol, decay: .2, freq: 1200, to: ch.snare });
      const g = gain(0); g.connect(ch.snare);
      osc("triangle", 185, t, env(g, t, .002, vol, 0, .1), g);
    },
    clap(t, vol = .12) {
      for (const [d, decay] of [[0, .02], [.012, .02], [.024, .18]]) this.hiss(t + d, { vol, decay, type: "bandpass", freq: 1300, to: ch.snare });
    },
    crash(t) { this.hiss(t, { vol: .05, decay: 2, freq: 5000, to: ch.snare }); },
    // Noise sweeping upwards into the next loop.
    riser(t, len) {
      const g = gain(0), f = filter("bandpass", 300, 2); f.connect(g).connect(ch.snare);
      f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(8000, t + len);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.05, t + len); g.gain.linearRampToValueAtTime(0, t + len + .05);
      noise(t, t + len + .05, f);
    },
    // Laser "pew", echoed by the delay.
    zap(t) {
      const g = gain(0); g.connect(ch.lead);
      osc("sine", 2000, t, env(g, t, .005, .05, .1, .3), g).frequency.exponentialRampToValueAtTime(150, t + .35);
    },
  };
}

// Chords as MIDI notes: bass root, pad voicing, arpeggio/stab notes.
const CALM = [ // Dmaj9  Bm9  Gmaj7  A9
  { root: 38, pad: [54, 57, 61, 64], arp: [62, 66, 69, 73, 76] },
  { root: 35, pad: [50, 54, 57, 61], arp: [59, 62, 66, 69, 73] },
  { root: 43, pad: [50, 54, 57, 59], arp: [62, 66, 67, 71, 74] },
  { root: 45, pad: [49, 52, 55, 59], arp: [61, 64, 67, 69, 71] },
];
const PUMP = [ // Am  F  C  G
  { root: 45, notes: [57, 60, 64] }, { root: 41, notes: [57, 60, 65] },
  { root: 48, notes: [55, 60, 64] }, { root: 43, notes: [55, 59, 62] },
];
const SUNNY = [ // C  G  Am  F
  { root: 36, notes: [60, 64, 67] }, { root: 43, notes: [59, 62, 67] },
  { root: 45, notes: [60, 64, 69] }, { root: 41, notes: [60, 65, 69] },
];
const TUNE = [ // [16th step, note] per bar, 8 bars
  [[0, 76], [2, 79], [4, 81], [6, 79], [8, 76], [12, 72]],
  [[0, 74], [2, 71], [4, 74], [6, 79], [10, 74]],
  [[0, 72], [2, 76], [4, 81], [6, 84], [8, 81], [10, 79], [12, 76]],
  [[0, 77], [4, 76], [6, 74], [8, 72], [12, 74]],
  [[0, 76], [2, 79], [4, 84], [8, 79], [10, 81], [12, 79]],
  [[0, 79], [2, 74], [4, 71], [6, 74], [8, 79], [12, 83]],
  [[0, 84], [2, 83], [4, 81], [6, 79], [8, 76], [10, 79], [12, 81]],
  [[0, 77], [2, 76], [4, 74], [8, 72]],
];
const NEON = [ // Dm9  Bbmaj7  Gm9  A7
  { root: 38, pad: [53, 57, 60, 64], arp: [62, 65, 69, 72] },
  { root: 34, pad: [53, 57, 58, 62], arp: [58, 62, 65, 69] },
  { root: 31, pad: [50, 53, 57, 58], arp: [55, 58, 62, 65] },
  { root: 33, pad: [52, 55, 57, 61], arp: [57, 61, 64, 67] },
];

// Each track is a loop of `steps` 16th notes; play() schedules whatever sounds on step `s` at time `t`.
const TRACKS = {
  // Slow D major: warm pad, soft bass, a music-box arpeggio drifting over it.
  calm: { bpm: 72, steps: 128, play(v, s, t, loop) {
    const i = s % 16, c = CALM[s >> 5], k = [0, 3, 6, 8, 11, 14].indexOf(i);
    if (s % 32 === 0) {
      v.pad(t, c.pad, 32 * v.S, .02, 900);
      v.bass(t, c.root, 28 * v.S, { type: "triangle", vol: .12, cutoff: 300 });
    }
    if (k >= 0 && rnd(s + loop * 128) > .25) v.bell(t, c.arp[[0, 2, 1, 3, 2, 4][(k + (s >> 4)) % 6]], { vol: .04, decay: 2 });
  } },
  // Four-on-the-floor dance loop in A minor; the lead arpeggio comes and goes.
  energetic: { bpm: 128, steps: 128, play(v, s, t, loop) {
    const i = s % 16, bar = s >> 4, c = PUMP[bar % 4];
    if (i % 4 === 0) v.kick(t);
    if (i === 4 || i === 12) v.clap(t);
    if (i % 4 === 2) v.hat(t, .04, true); else if (i % 2) v.hat(t, .02);
    if (i % 4) v.bass(t, c.root + (i % 4 === 2 ? 12 : 0), .7 * v.S, { vol: .09, cutoff: 900 });
    if (i === 0) v.pad(t, c.notes, 16 * v.S, .01, 2500);
    if (i % 4 === 2) for (const m of c.notes) v.pluck(t, m + 12, { type: "sawtooth", vol: .02, decay: .15, cutoff: 2500 });
    if (bar >= 4 || loop % 2) {
      const arp = [...c.notes, ...c.notes.map((m) => m + 12)];
      v.pluck(t, arp[[0, 1, 2, 3, 4, 5, 4, 2][i % 8]] + 12, { vol: .025, decay: .12, cutoff: 3000 });
    }
    if (s === 0 && loop) v.crash(t);
    if (s === 112) v.riser(t, 16 * v.S);
  } },
  // Bouncy C major pop: marimba tune, ukulele-ish offbeat chords, a glockenspiel joins every other time round.
  happy: { bpm: 116, steps: 128, play(v, s, t, loop) {
    const i = s % 16, bar = s >> 4, c = SUNNY[bar % 4];
    if (i === 0 || i === 8) v.kick(t, .4);
    if (i === 4 || i === 12) v.snare(t, .09);
    if (i % 2 === 0) v.hat(t, i % 4 ? .025 : .012);
    const b = { 0: 0, 3: 0, 6: 7, 8: 12, 10: 0, 14: 7 }[i];
    if (b !== undefined) v.bass(t, c.root + b, 1.2 * v.S, { type: "square", vol: .05, cutoff: 700 });
    if (i % 4 === 2) for (const m of c.notes) v.pluck(t, m, { type: "triangle", vol: .035, decay: .18, cutoff: 3000 });
    const note = TUNE[bar].find(([at]) => at === i)?.[1];
    if (note) {
      v.bell(t, note, { vol: .06, decay: .5, ratio: 4, index: 1.5 });
      if (loop % 2) v.bell(t, note + 12, { vol: .02, decay: .8 });
    }
  } },
  // Synthwave in D minor: octave bass, echoing 16th arpeggio with a filter that opens and closes.
  futuristic: { bpm: 100, steps: 128, play(v, s, t, loop) {
    const i = s % 16, bar = s >> 4, c = NEON[bar >> 1], sweep = .5 - .5 * Math.cos(2 * Math.PI * s / 128);
    if (s % 32 === 0) v.pad(t, c.pad, 32 * v.S, .015, 1100);
    if (i % 2 === 0) v.bass(t, c.root + (i % 4 ? 12 : 0), 1.5 * v.S, { vol: .09, cutoff: 500 + 700 * sweep });
    v.pluck(t, c.arp[[0, 1, 2, 3, 2, 1, 3, 2][i % 8]] + (i >= 8 ? 12 : 0), { vol: .025, decay: .15, cutoff: 700 + 2500 * sweep });
    if (loop || bar >= 2) { // drums come in after a two-bar intro
      if (i === 0 || i === 8 || i === 11) v.kick(t, .45);
      if (i === 4 || i === 12) v.snare(t);
      v.hat(t, i % 4 === 2 ? .025 : .01);
    }
    if (s === 120) v.zap(t);
  } },
};

// Look-ahead scheduler: every 50 ms, queue the steps due in the next 250 ms.
let audio, master, playing;
function music(name) {
  if (playing) {
    const { out, timer } = playing;
    clearInterval(timer);
    out.gain.setTargetAtTime(0, audio.currentTime, .15);
    setTimeout(() => out.disconnect(), 1500);
    playing = null;
  }
  const track = TRACKS[name];
  if (!track) { if (audio) setTimeout(() => playing || audio.suspend(), 1000); return; }
  if (!audio) {
    audio = new AudioContext();
    master = audio.createDynamicsCompressor();
    master.connect(audio.destination);
    // Browsers only start audio after a user gesture; also pause while the tab is hidden.
    for (const e of ["pointerdown", "keydown"]) addEventListener(e, () => playing && audio.resume());
    document.addEventListener("visibilitychange", () => document.hidden ? audio.suspend() : playing && audio.resume());
  }
  audio.resume();
  const S = 60 / track.bpm / 4, out = audio.createGain();
  out.connect(master);
  const v = instruments(audio, out, S);
  let s = 0, t = audio.currentTime + .1;
  const tick = () => {
    if (t < audio.currentTime) t = audio.currentTime + .05; // fell behind: skip ahead rather than cram notes
    for (; t < audio.currentTime + .25; t += S, s++) track.play(v, s % track.steps, t, Math.floor(s / track.steps));
  };
  tick();
  playing = { out, timer: setInterval(tick, 50) };
}
$("music").addEventListener("change", () => music($("music").value));
music($("music").value);

function reset() {
  board =Array.from({ length: ROWS }, () => Array(COLS).fill("."));
  over = busy = false;
  $("error").textContent = "";
  $("status").textContent = "Your turn — click a column.";
  buildBoard();
  lock();
  if ($("first").value === "O") aiTurn();
}
$("reset").onclick = reset;
reset();
</script>
